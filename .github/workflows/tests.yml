name: UI tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps

      - name: Create required directories
        run: |
          mkdir -p allure-results allure-history
          echo "Directories created"

      - name: Run Playwright tests
        run: |
          pytest -m regression --alluredir=allure-results --numprocesses 2
        continue-on-error: true

      - name: Check Dockerfile
        id: docker_check
        run: |
          if [ -f "Dockerfile" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ Dockerfile not found - skipping Docker build"
          fi

      - name: Build Docker image (if Dockerfile exists)
        if: steps.docker_check.outputs.exists == 'true'
        run: |
          docker build -t ui-tests .
          echo "✅ Docker image built successfully"

      - name: Get Allure history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Copy history to allure-history
        if: always()
        run: |
          if [ -d "gh-pages" ] && [ "$(ls -A gh-pages 2>/dev/null)" ]; then
            cp -r gh-pages/* allure-history/ || true
            echo "History copied from gh-pages"
          else
            echo "No existing history found"
          fi
          mkdir -p allure-history

      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@v1.7
        if: always()
        with:
          allure_results: allure-results
          allure_history: allure-history

      - name: Deploy report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'