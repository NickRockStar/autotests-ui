name: UI tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Опционально: для тестирования Node 24
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5.1.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps

      # 🔥 СОЗДАЕМ ВСЕ ДИРЕКТОРИИ
      - name: Create directories
        run: |
          mkdir -p allure-results allure-history
          echo "✅ Directories created"
          echo "Initial history" > allure-history/.keep
          ls -la

      - name: Run Playwright tests
        run: |
          pytest -m regression --alluredir=allure-results --numprocesses 2
        continue-on-error: true

      # 🔥 ИСПРАВЛЕННЫЙ ШАГ: Клонируем gh-pages без ошибки
      - name: Get or create gh-pages history
        if: always()
        run: |
          # Пытаемся клонировать, но не падаем при ошибке
          git clone --depth 1 --branch gh-pages \
            https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git \
            gh-pages 2>/dev/null || true
          
          # Если клонирование не удалось, создаем пустую директорию
          if [ ! -d "gh-pages" ]; then
            mkdir -p gh-pages
            echo "ℹ️ gh-pages branch does not exist, created empty directory"
          else
            echo "✅ gh-pages cloned successfully"
            # Копируем историю, если она есть
            if [ "$(ls -A gh-pages 2>/dev/null)" ]; then
              cp -r gh-pages/* allure-history/ || true
              echo "✅ History copied from gh-pages"
            fi
          fi

      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@v1.7
        if: always()
        with:
          allure_results: allure-results
          allure_history: allure-history

      - name: Deploy report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

      # 🔥 ОТЛАДКА DOCKER (если используете)
      - name: Debug and build Docker
        if: always()  # Запускаем даже если тесты упали
        run: |
          echo "Current directory: $(pwd)"
          echo "Dockerfile exists:"
          ls -la Dockerfile || echo "⚠️ Dockerfile not found!"
          
          echo "Building Docker image..."
          docker build --no-cache -t my-app . || {
            echo "❌ Docker build failed. Check Dockerfile and context."
            exit 1
          }
          echo "✅ Docker build successful"