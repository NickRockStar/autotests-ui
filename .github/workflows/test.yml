# Имя вашего workflow, которое будет отображаться в интерфейсе GitHub Actions
name: UI tests

# Указываем, когда будет запускаться данный workflow
on:
  push:
    branches:
      - main  # Запускать workflow, когда будет сделан коммит в ветку main
  pull_request:
    branches:
      - main  # Запускать workflow, когда будет сделан pull request в ветку main

# Определяем все шаги, которые должны быть выполнены в рамках работы с тестами
jobs:
  run-tests:
    runs-on: ubuntu-latest  # Указываем, что тесты будут запускаться на последней версии Ubuntu

    steps:
      # 1. Шаг, который будет клонировать ваш репозиторий на машину GitHub Actions
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Добавляем для полной истории (нужно для Allure)

      # 2. Шаг для установки Python на виртуальной машине
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # 3. Шаг для установки всех зависимостей проекта
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps

      # 4. Шаг для создания необходимых директорий (НОВЫЙ ШАГ)
      - name: Create required directories
        run: |
          mkdir -p allure-results
          mkdir -p allure-history
          echo "Directories created successfully"
          ls -la  # Отладка - показываем содержимое

      # 5. Шаг для запуска тестов с использованием pytest и генерации отчётов Allure
      - name: Run Playwright tests with pytest and generate Allure results
        run: |
          pytest -m regression --alluredir=allure-results --numprocesses 2
        continue-on-error: true  # Продолжаем даже если тесты упали

      # 6. Шаг для получения истории отчётов Allure, если она существует
      - name: Get Allure history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      # 7. Шаг для копирования истории из gh-pages в allure-history (НОВЫЙ ШАГ)
      - name: Copy history from gh-pages if exists
        if: always()
        run: |
          if [ -d "gh-pages" ] && [ "$(ls -A gh-pages)" ]; then
            cp -r gh-pages/* allure-history/ || true
            echo "History copied from gh-pages"
          else
            echo "No history found in gh-pages, using empty directory"
          fi
          # Убеждаемся, что директория существует
          mkdir -p allure-history

      # 8. Шаг для генерации и отображения отчёта Allure
      - name: Generate Allure Report with history
        uses: simple-elf/allure-report-action@v1.7
        if: always()
        with:
          allure_results: allure-results
          allure_history: allure-history
          # Добавляем дополнительный параметр, если нужно
          gh_pages: gh-pages

      # 9. Шаг для деплоя отчёта Allure на GitHub Pages
      - name: Deploy report to Github Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
          keep_files: true  # Сохраняем историю при деплое
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'