name: UI tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps

      # 🔥 КРИТИЧЕСКИЙ ШАГ - создаем все директории
      - name: Initialize directories
        run: |
          mkdir -p allure-results allure-history
          echo "✅ allure-results and allure-history created"
          
          # Создаем файл-маркер, чтобы убедиться, что директория не пустая
          echo "Initial history" > allure-history/.keep
          ls -la allure-history/

      - name: Run Playwright tests
        run: |
          pytest -m regression --alluredir=allure-results --numprocesses 2
        continue-on-error: true

      - name: Get Allure history from gh-pages
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Merge history
        if: always()
        run: |
          # Убеждаемся, что директория существует
          mkdir -p allure-history
          
          # Копируем историю, если есть
          if [ -d "gh-pages" ] && [ "$(ls -A gh-pages 2>/dev/null)" ]; then
            cp -r gh-pages/* allure-history/ || true
            echo "✅ History copied from gh-pages"
          else
            echo "ℹ️ No existing history found, using fresh directory"
          fi
          
          # Проверяем, что директория не пустая
          if [ ! "$(ls -A allure-history 2>/dev/null)" ]; then
            echo "⚠️ allure-history is empty, creating placeholder"
            echo "Initial history" > allure-history/.keep
          fi
          
          echo "📁 allure-history contents:"
          ls -la allure-history/

      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@v1.7
        if: always()
        with:
          allure_results: allure-results
          allure_history: allure-history
        continue-on-error: false  # Можно оставить false, если уверены, что директория существует

      - name: Deploy report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'